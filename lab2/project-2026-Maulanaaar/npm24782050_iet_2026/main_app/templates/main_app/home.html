{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background-image:url("{% static '4.jpeg' %}");
    background-size:cover;
    background-position:center;
}

/* overlay agar tulisan tetap terlihat */
.overlay{
    background:rgba(0,0,0,0.45);
    min-height:100vh;
    padding-top:120px;
}

/* judul */
.title{
    text-align:center;
    color:white;
    font-size:34px;
    margin-bottom:50px;
}

/* container menu */
.menu{
    width:60%;
    margin:auto;

    display:flex;
    justify-content:center;
    gap:40px;
}

/* card fitur transparan */
.card{

    width:320px;
    padding:30px;

    border-radius:12px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);

    text-align:center;
    color:white;
}

.card h2{
    margin-bottom:10px;
}

.card p{
    margin-bottom:20px;
}

/* tombol */
.btn{
    text-decoration:none;
    background:#3498db;
    color:white;
    padding:10px 18px;
    border-radius:6px;
}

.btn:hover{
    background:#2c80b4;
}

/* info lokasi */
.info-section{
    text-align:center;
    color:white;
    margin-top:80px;
    padding:30px;
}

.info-section h3{
    font-size:20px;
    margin-bottom:10px;
}

.info-section p{
    font-size:18px;
    margin:5px 0;
}

</style>

</head>

<body>

<div class="overlay">

<h1 class="title">SELAMAT DATANG</h1>

<div class="menu">

<div class="card">

<h2>Profil Lengkap</h2>
<p>Lihat informasi lengkap tentang saya</p>

<a class="btn" href="/about/">
Lihat Profil
</a>

</div>

<div class="card">

<h2>Daftar Laporan</h2>
<p>Lihat semua laporan yang telah dibuat</p>

<a class="btn" href="/reports/">
Lihat Laporan
</a>

</div>

<div class="card">

<h2>Social Media</h2>
<p>Kunjungi sosial media saya</p>

<a class="btn" href="/contacts/">
Lihat Social Media
</a>

</div>

</div>

<div class="info-section">
<h3>Daftar Laporan</h3>
<p>Desa Hajimena Natar Lampung Selatan</p>
</div>

</div>

</body>
</html>
