<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Portal - Smart City</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .hero-card {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-radius: 18px;
        }

        .content-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .stat-icon {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background-color: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            font-size: 1.4rem;
        }

        .page-section {
            min-height: 75vh;
        }

        .report-item {
            border-left: 4px solid #0d6efd;
        }

        .sidebar-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .report-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .badge-status {
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }

        .progress {
            height: 10px;
            border-radius: 999px;
        }

        .modal-content {
            border: none;
            border-radius: 18px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#dashboard">
                <i class="bi bi-buildings-fill me-2"></i>
                Smart City Citizen Portal
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-menu">
                    <li class="nav-item">
                        <a class="nav-link" href="#login">
                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN APP -->
    <main class="container-fluid px-4 py-4">
        <div id="app-content">
            <!-- Konten SPA akan dirender dari router.js -->
        </div>
    </main>

    <!-- MODAL TAMBAH / EDIT LAPORAN -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="reportModalLabel">
                        <i class="bi bi-pencil-square me-2"></i>
                        Form Laporan
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>

                <div class="modal-body">
                    <form id="reportForm">
                        <input type="hidden" id="reportId">

                        <div class="mb-3">
                            <label for="reportTitle" class="form-label">Judul Laporan</label>
                            <input type="text" class="form-control" id="reportTitle" placeholder="Contoh: Jalan Rusak di Depan Balai Desa" required>
                        </div>

                        <div class="mb-3">
                            <label for="reportCategory" class="form-label">Kategori</label>
                            <select class="form-select" id="reportCategory" required>
                                <option value="">Pilih kategori laporan</option>
                                <option value="Jalan Rusak">Jalan Rusak</option>
                                <option value="Lampu Mati">Lampu Mati</option>
                                <option value="Kebersihan">Kebersihan</option>
                                <option value="Keamanan">Keamanan</option>
                                <option value="Banjir">Banjir</option>
                                <option value="Fasilitas Umum">Fasilitas Umum</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="reportLocation" class="form-label">Lokasi</label>
                            <input type="text" class="form-control" id="reportLocation" placeholder="Contoh: Desa Hajimena, Lampung Selatan" required>
                        </div>

                        <div class="mb-3">
                            <label for="reportDescription" class="form-label">Deskripsi Laporan</label>
                            <textarea class="form-control" id="reportDescription" rows="4" placeholder="Jelaskan masalah yang ingin dilaporkan..." required></textarea>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i>
                        Batal
                    </button>

                    <button type="button" class="btn btn-warning" id="btnSaveDraft">
                        <i class="bi bi-save me-1"></i>
                        Simpan Draft
                    </button>

                    <button type="button" class="btn btn-primary" id="btnSubmitReport">
                        <i class="bi bi-send me-1"></i>
                        Ajukan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
