<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Smart City{% endblock %}</title>

    <!-- 🔥 Bootstrap FIX -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- 🔥 NAVBAR FIX -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            <strong>Desa Hajimena</strong><br>
            <small style="font-size: 12px;">Natar, Lampung Selatan</small>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">🏠 Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'report_list' %}">📋 Laporan</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add_report' %}">➕ Tambah</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<!-- 🔥 CONTENT -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- 🔥 Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
