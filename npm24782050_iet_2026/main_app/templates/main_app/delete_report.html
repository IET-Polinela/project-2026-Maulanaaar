{% extends 'base.html' %}

{% block title %}Hapus Laporan{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">

                <h3 class="text-danger">⚠️ Hapus Laporan</h3>

                <p class="mt-3">
                    Apakah Anda yakin ingin menghapus laporan ini?
                </p>

                <hr>

                <div class="text-start mb-4">
                    <p><strong>Judul:</strong> {{ object.title }}</p>
                    <p><strong>Kategori:</strong> {{ object.category }}</p>
                    <p><strong>Lokasi:</strong> {{ object.location }}</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <!-- ✅ SUBMIT LANGSUNG -->
                    <button type="submit" class="btn btn-danger" onclick="this.disabled=true; this.innerText='Menghapus...';">
                        Ya, Hapus
                    </button>

                    <a href="{% url 'report_list' %}" class="btn btn-secondary">
                        Batal
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
