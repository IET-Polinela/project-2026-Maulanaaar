<!DOCTYPE html>
<html>
<head>
    <title>Hapus Laporan</title>
</head>
<body>

    <h1>Hapus Laporan</h1>

    <p>Apakah Anda yakin ingin menghapus laporan ini?</p>

    <p><b>Judul:</b> {{ report.title }}</p>
    <p><b>Kategori:</b> {{ report.category }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Ya, Hapus</button>
    </form>

    <a href="{% url 'home' %}">Batal</a>

</body>
</html>
